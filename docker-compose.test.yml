services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: professorit_test
      POSTGRES_USER: professorit_test
      POSTGRES_PASSWORD: professorit_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U professorit_test -d professorit_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://professorit_test:professorit_test@postgres:5432/professorit_test
      DATABASE_URL: postgresql+asyncpg://professorit_test:professorit_test@postgres:5432/professorit_test
      BOT_TOKEN: 123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      BEGINNING_WORKING_DAY: "9"
      END_WORKING_DAY: "18"
      CALENDAR_TIMEZONE: Europe/Moscow
    volumes:
      - .:/app
    entrypoint: ["python", "-m", "unittest"]
    command: ["tests.test_critical_business_flows", "-v"]
