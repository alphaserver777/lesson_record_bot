#docker-compose.yml
version: "2"

services:
  app:
    build: .
    container_name: bot_service_appointment
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/database.db
      - TZ=Europe/Moscow
    volumes:
      - ./database:/app/data/
      - ./logs/:/app/logs/
    command: ["python", "main.py"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f main.py >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
