version: "2"

services:
  app:
    build: .
    container_name: bot_service_appointment_dev
    restart: unless-stopped
    env_file: .env.dev
    volumes:
      - ./database_dev:/app/data/database_dev/
      - ./logs_dev:/app/logs/
    command: ["python", "main.py"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f main.py >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
