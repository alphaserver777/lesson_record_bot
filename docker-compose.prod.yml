services:
  app:
    build: .
    container_name: bot_service_appointment_prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      - DB_PATH=/app/data/database.db
      - TZ=Europe/Moscow
      - CALENDAR_TIMEZONE=Europe/Moscow
    volumes:
      - ./database_prod:/app/data/
      - ./logs_prod:/app/logs/
    command: ["python", "main.py"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f main.py >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  miniapp-api:
    build: .
    container_name: bot_service_appointment_miniapi_prod
    restart: unless-stopped
    env_file: .env.prod.docker
    environment:
      - DB_PATH=/app/data/database.db
      - WEBAPI_PORT=8000
      - TZ=Europe/Moscow
      - CALENDAR_TIMEZONE=Europe/Moscow
    volumes:
      - ./database_prod:/app/data/
      - ./logs_prod:/app/logs/
    entrypoint: ["python", "main_webapi.py"]
    ports:
      - "127.0.0.1:28000:8000"

  miniapp-frontend:
    image: node:20-alpine
    container_name: bot_service_appointment_miniapp_front_prod
    restart: unless-stopped
    working_dir: /frontend
    volumes:
      - ./miniapp:/frontend
    command: sh -c "npm install && npm run build && npx serve -s dist -l 25173"
    environment:
      - VITE_API_BASE=https://axtar-b2b.ru/miniapi
    ports:
      - "127.0.0.1:25173:25173"
