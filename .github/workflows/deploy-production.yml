name: Развернуть рабочий выпуск

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Аннотированная метка вида professorit-vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Развернуть VM 201
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Проверить выпускные исходники
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch origin main --tags --force
          python scripts/verify_release_source.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --require-main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Установить Ansible
        run: |
          python -m pip install --no-cache-dir ansible-core==2.17.7
          ansible-galaxy collection install -r infra/ansible/requirements.yml
      - name: Настроить закрытое SSH-подключение
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Развернуть и проверить выпуск
        env:
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cd infra/ansible && ansible-playbook deploy.yml -e "release_id=$RELEASE_TAG" -e "release_commit=$GITHUB_SHA"
