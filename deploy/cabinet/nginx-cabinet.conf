# Included inside the existing server block for crm.befa-robotics.com.
# Keep these locations before the catch-all location that proxies Twenty.
location = /cabinet {
    return 301 /cabinet/;
}

location ^~ /cabinet/api/ {
    proxy_pass http://127.0.0.1:18000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}

location ^~ /cabinet/ {
    proxy_pass http://127.0.0.1:15173/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
